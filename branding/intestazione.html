<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GASTER BLESS – MASTER SUITE</title>
<link rel="stylesheet" href="marchio.css">
<style>
  body { margin: 0; background: var(--gb-fondo-esterno); color: var(--gb-bianco); font-family: var(--gb-carattere); padding: 24px 16px; }
  main { max-width: 960px; margin: 0 auto; display: grid; gap: 28px; }
  .barra { background: var(--gb-fondo); border-radius: 10px; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
  .barra > span { color: var(--gb-grigio); font-size: .85rem; }
  h2 { color: var(--gb-grigio); font-weight: 400; font-size: .9rem; margin: 0 0 8px; }
</style>
</head>
<body>
<main>
  <section>
    <h2>Intestazione completa (accesso, pagina iniziale, copertine)</h2>
    <div class="gb-intestazione">
      <h1 class="gb-nome">Gaster Bless</h1>
      <div class="gb-suite">Master Suite</div>
      <hr class="gb-filetto">
      <div class="gb-slogan">Master your world</div>
      <div class="gb-sottotitolo">The universal tabletop RPG platform</div>
    </div>
  </section>
  <section>
    <h2>Logo breve (barra in alto delle schermate interne)</h2>
    <div class="barra"><a class="gb-logo" href="#"><span class="gb-nome">Gaster Bless</span><span class="gb-suite">Master Suite</span></a><span>Sessioni · Mappa · Iniziativa · Schede</span></div>
  </section>
</main>
</body>
</html>
